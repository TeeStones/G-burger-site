<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G Burger - Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --char:#1f130d; --char-2:#2a1a11; --gold:#e8a33d; --ketchup:#c1382b;
    --paper:#f3ead9; --paper-2:#ece0c9; --ink:#2a1d16; --pickle:#7c8a52;
    --line: rgba(243,234,217,0.18);
    --font-display:'Barlow Condensed', sans-serif; --font-body:'Karla', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:var(--font-body); line-height:1.5;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}

  header.site-nav{background:var(--char); border-bottom:1px solid var(--line);}
  .nav-inner{max-width:1180px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:14px 24px;}
  .wordmark{font-family:var(--font-display); font-weight:800; font-size:26px; color:var(--paper);}
  .wordmark span{color:var(--gold);}
  .nav-right{display:flex; align-items:center; gap:18px;}
  .admin-tag{font-size:12px; font-weight:700; color:var(--gold); border:1px solid rgba(232,163,61,0.45); padding:4px 10px; border-radius:100px;}
  .nav-right a{color:rgba(243,234,217,0.75); text-decoration:none; font-size:14px; font-weight:500;}
  .nav-right a:hover{color:var(--gold);}

  .gate{background:linear-gradient(180deg, var(--char) 0%, var(--char-2) 100%); min-height:70vh; display:flex; align-items:center; justify-content:center; padding:60px 24px;}
  .gate-box{width:100%; max-width:380px; text-align:left;}
  .gate-box .icon{width:52px; height:52px; border-radius:50%; background:rgba(232,163,61,0.12); border:1px solid rgba(232,163,61,0.4); display:flex; align-items:center; justify-content:center; margin-bottom:22px;}
  .gate-box .icon svg{width:20px; height:20px;}
  h1.gate-title{font-family:var(--font-display); font-weight:800; font-size:38px; color:var(--paper); line-height:1;}
  p.gate-sub{color:rgba(243,234,217,0.6); font-size:15px; margin:12px 0 26px;}
  .gate-box input[type=password]{width:100%; padding:13px 14px; border:1px solid rgba(243,234,217,0.25); border-radius:4px; font-size:15px; margin-bottom:12px; background:rgba(243,234,217,0.06); color:var(--paper);}
  .gate-box input[type=password]::placeholder{color:rgba(243,234,217,0.4);}
  .gate-box .err{color:#e88b7c; font-size:13px; margin-bottom:12px; display:none;}
  .btn-primary{background:var(--gold); color:var(--char); border:none; padding:13px 24px; border-radius:3px; font-weight:700; font-size:15px; width:100%; text-align:center;}
  .btn-primary:hover{background:#f0b34f;}

  .dashboard{display:none; padding:44px 24px 100px;}
  .dashboard.open{display:block;}
  .dash-inner{max-width:820px; margin:0 auto;}
  h2.section-title{font-family:var(--font-display); font-weight:700; font-size:32px; margin-bottom:6px;}
  p.section-sub{color:#6a5a4a; font-size:15px; margin-bottom:28px;}

  .panel{background:#fff; border:1px solid rgba(42,29,22,0.12); border-radius:6px; padding:26px; margin-bottom:22px;}
  .panel h3{font-family:var(--font-display); font-weight:700; font-size:19px; color:var(--ink); margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block; font-size:12px; font-weight:700; color:#4a3a2c; margin-bottom:5px;}
  .field input, .field textarea{width:100%; padding:9px 11px; border:1px solid rgba(42,29,22,0.25); border-radius:4px; font-family:inherit; font-size:14px; background:var(--paper);}
  .field textarea{min-height:70px; resize:vertical;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:560px){.field-row{grid-template-columns:1fr;}}

  .cat-editor{border-top:1px solid rgba(42,29,22,0.12); padding-top:16px; margin-top:16px;}
  .cat-editor:first-child{border-top:none; margin-top:0; padding-top:0;}
  .cat-editor h4{font-size:15px; font-weight:700; margin-bottom:4px;}
  .cat-image-field{margin-bottom:10px;}
  .cat-image-field input{font-size:12px;}
  .item-row-edit{display:flex; align-items:flex-start; gap:6px; padding:7px 0; border-bottom:1px dashed rgba(42,29,22,0.12);}
  .item-row-edit:last-of-type{border-bottom:none;}
  .item-row-edit .name-input{flex:1.4;}
  .item-row-edit .price-input{flex:0 0 90px;}
  .item-row-edit .desc-input{flex:2;}
  .item-row-edit input{padding:7px 9px; font-size:12px;}
  .item-row-edit button{background:none; border:none; color:var(--ketchup); font-size:17px; line-height:1; padding:4px 6px;}
  .add-item-btn{margin-top:10px; background:transparent; border:1px dashed rgba(42,29,22,0.35); color:#4a3a2c; width:100%; padding:8px; border-radius:4px; font-size:12px;}

  .save-bar{position:sticky; bottom:0; background:var(--paper); padding:18px 0 4px; display:flex; align-items:center; gap:14px; border-top:1px solid rgba(42,29,22,0.1); margin-top:8px;}
  .save-bar button{background:var(--gold); border:none; color:var(--char); font-weight:700; padding:13px 26px; border-radius:4px; font-size:15px;}
  .save-bar .status{font-size:13px; color:var(--pickle);}
  .logout-link{background:none; border:none; color:var(--ketchup); font-size:13px; text-decoration:underline; margin-left:auto;}
</style>
</head>
<body>

<header class="site-nav">
  <div class="nav-inner">
    <div class="wordmark">G BURGER<span>.</span></div>
    <div class="nav-right">
      <span class="admin-tag">Admin</span>
      <a href="../index.html">View live site</a>
    </div>
  </div>
</header>

<section class="gate" id="gate">
  <div class="gate-box">
    <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#e8a33d" stroke-width="2"><rect x="4" y="11" width="16" height="9" rx="1.5"></rect><path d="M7 11V7a5 5 0 0110 0v4"></path></svg></div>
    <h1 class="gate-title">Site editor</h1>
    <p class="gate-sub">Enter the password to edit what visitors see on the main site.</p>
    <div class="err" id="pwError">That password isn't right - try again.</div>
    <input type="password" id="pwInput" placeholder="Password" autofocus>
    <button class="btn-primary" id="pwSubmit">Unlock</button>
  </div>
</section>

<main class="dashboard" id="dashboard">
  <div class="dash-inner">
    <h2 class="section-title">G Burger admin</h2>
    <p class="section-sub">Changes save live and appear immediately for every visitor to the main site.</p>

    <div class="panel">
        <h3>Hero and about</h3>
        <div class="field"><label>Hero tagline</label><textarea id="edit-tagline"></textarea></div>
        <div class="field"><label>About text</label><textarea id="edit-about"></textarea></div>
      </div>

      <div class="panel">
        <h3>Contact and hours</h3>
        <div class="field-row">
          <div class="field"><label>Price range (shown in the stats bar)</label><input id="edit-price"></div>
          <div class="field"><label>Phone (digits only, with country code)</label><input id="edit-phone"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Address (short, for stats bar)</label><input id="edit-addrShort"></div>
          <div class="field"><label>Instagram handle (no @) - orders get sent here</label><input id="edit-instagram"></div>
        </div>
        <div class="field"><label>Full address</label><input id="edit-addr"></div>
        <div class="field"><label>VAT note</label><input id="edit-vatNote"></div>
      </div>

      <div class="panel">
        <h3>Menu</h3>
        <div id="categoryEditorList"></div>
      </div>

      <div class="save-bar">
        <button id="saveBtn">Save changes</button>
        <span class="status" id="saveStatus"></span>
        <button class="logout-link" id="logoutBtn">Log out</button>
      </div>
  </div>
</main>

<script>
var SITE_PASSWORD = "WuseGrill#47xK";

var DEFAULTS = {
  tagline: "Fresh halal beef patties, hand-cut fries, and thick milkshakes - Wuse 2's go-to burger counter. Order for pickup, delivery, or dine in.",
  about: "A no-shortcuts burger counter in Wuse 2 - beef patties made from fresh 100% halal beef, no additives or fillers, grilled to order and topped with deep-fried onions and our own sauces.",
  price: "NGN 7,500 - 9,500 per burger",
  addr: "55 Kumasi Cres, Wuse 2, Abuja 900288, Federal Capital Territory",
  addrShort: "55 Kumasi Cres, Wuse 2, Abuja",
  phone: "2347087271489",
  instagram: "gburger_abj",
  vatNote: "All prices inclusive of VAT.",
  menuCategories: [
    { name: "The House Burgers", image: "https://images.unsplash.com/photo-1603508102983-99b101395d1a",
      items: [
        {name:"House Beef Burger", price:7500, desc:"Juicy beef burger cooked to taste topped with cocktail coleslaw, deep fried onions, mayo and ketchup."},
        {name:"House Cheese Burger", price:8000, desc:"Juicy beef burger cooked to taste topped with cheese, cocktail coleslaw, deep fried onions, mayo and ketchup."},
        {name:"House Double Beef Burger", price:8500, desc:"Juicy double beef burger cooked to taste topped with deep fried onions, cocktail coleslaw, fresh sliced cucumber, mayo and ketchup."},
        {name:"House Double Double", price:9500, desc:""}
      ]
    },
    { name: "The G-Burgers", image: "https://images.unsplash.com/photo-1667588011209-00ba38093eb0",
      items: [
        {name:"Big G - Double Cheese Burger", price:9000, desc:"Double juicy beef burger cooked to taste topped with deep fried onions, fresh crisp salad, cheese and the G-Burger sauce."},
        {name:"G Mex Chilli Cheese Burger", price:8000, desc:"Juicy beef burger topped with crisp salad, deep fried onions, cheese, G sauce, house chilli sauce and sweet vinaigrette. Spicy."}
      ]
    },
    { name: "Fries", image: "https://images.unsplash.com/photo-1534938665420-4193effeacc4",
      items: [
        {name:"French Fries", price:4500, desc:""},
        {name:"Chilli Cheese Fries", price:6800, desc:"Deep fried French fries topped with cheese, house chilli sauce, deep fried onions, cocktail coleslaw, ketchup and house vinaigrette. Spicy."}
      ]
    },
    { name: "Milk Shakes", image: "https://images.unsplash.com/photo-1583024012457-b6de05b7003a",
      items: [
        {name:"Strawberry Shake", price:6500, desc:""},
        {name:"Vanilla Shake", price:6500, desc:""},
        {name:"Chocolate Shake", price:6500, desc:""},
        {name:"Cocktail Shake", price:6500, desc:"Vanilla, strawberry and chocolate mix."}
      ]
    },
    { name: "Drinks", image: "https://images.unsplash.com/photo-1720468750651-71bf110a05e5",
      items: [
        {name:"Bottled Water", price:300, desc:""},
        {name:"Pop Drinks", price:500, desc:""}
      ]
    },
    { name: "G Cafe", image: "https://images.unsplash.com/photo-1544055931-0f1e0a14c892",
      items: [
        {name:"Espresso", price:2000, desc:""},
        {name:"Cappuccino", price:4000, desc:""},
        {name:"Americano", price:3000, desc:""},
        {name:"Mocha", price:4000, desc:""},
        {name:"Frappuccino", price:6500, desc:""},
        {name:"Caramel Frappuccino", price:6500, desc:""},
        {name:"Tea", price:2500, desc:""},
        {name:"Spanish Iced Latte", price:4000, desc:""}
      ]
    }
  ]
};

var content = JSON.parse(JSON.stringify(DEFAULTS));
var sessionPassword = "";

function loadContent(){
  return fetch('/api/content')
    .then(function(res){ return res.json(); })
    .then(function(data){ if(data){ content = Object.assign({}, DEFAULTS, data); } })
    .catch(function(e){ /* defaults are fine */ });
}

function fillForm(){
  document.getElementById('edit-tagline').value = content.tagline;
  document.getElementById('edit-about').value = content.about;
  document.getElementById('edit-price').value = content.price;
  document.getElementById('edit-phone').value = content.phone;
  document.getElementById('edit-addrShort').value = content.addrShort || "";
  document.getElementById('edit-instagram').value = content.instagram || "";
  document.getElementById('edit-addr').value = content.addr;
  document.getElementById('edit-vatNote').value = content.vatNote || "";
  renderCategoryEditor();
}

function renderCategoryEditor(){
  var wrap = document.getElementById('categoryEditorList');
  wrap.innerHTML = "";
  content.menuCategories.forEach(function(cat, catIdx){
    var block = document.createElement('div');
    block.className = 'cat-editor';
    var itemsHtml = "";
    cat.items.forEach(function(item, itemIdx){
      itemsHtml +=
        '<div class="item-row-edit">' +
        '<input class="name-input" data-cat="' + catIdx + '" data-item="' + itemIdx + '" data-field="name" value="' + item.name + '" placeholder="Item name">' +
        '<input class="price-input" data-cat="' + catIdx + '" data-item="' + itemIdx + '" data-field="price" value="' + item.price + '" placeholder="Price">' +
        '<input class="desc-input" data-cat="' + catIdx + '" data-item="' + itemIdx + '" data-field="desc" value="' + (item.desc || '') + '" placeholder="Description">' +
        '<button data-remove-cat="' + catIdx + '" data-remove-item="' + itemIdx + '" title="Remove item">x</button>' +
        '</div>';
    });
    block.innerHTML =
      '<h4>' + cat.name + '</h4>' +
      '<div class="cat-image-field"><input data-cat-image="' + catIdx + '" value="' + cat.image + '" placeholder="Category image URL"></div>' +
      itemsHtml +
      '<button class="add-item-btn" data-add-item="' + catIdx + '">+ Add item to ' + cat.name + '</button>';
    wrap.appendChild(block);
  });

  wrap.querySelectorAll('[data-field]').forEach(function(inp){
    inp.addEventListener('input', function(){
      var catIdx = +inp.dataset.cat;
      var itemIdx = +inp.dataset.item;
      var field = inp.dataset.field;
      var val = inp.value;
      if(field === 'price') val = Number(val) || 0;
      content.menuCategories[catIdx].items[itemIdx][field] = val;
    });
  });
  wrap.querySelectorAll('[data-cat-image]').forEach(function(inp){
    inp.addEventListener('input', function(){
      content.menuCategories[+inp.dataset.catImage].image = inp.value;
    });
  });
  wrap.querySelectorAll('[data-remove-cat]').forEach(function(btn){
    btn.addEventListener('click', function(){
      content.menuCategories[+btn.dataset.removeCat].items.splice(+btn.dataset.removeItem, 1);
      renderCategoryEditor();
    });
  });
  wrap.querySelectorAll('[data-add-item]').forEach(function(btn){
    btn.addEventListener('click', function(){
      content.menuCategories[+btn.dataset.addItem].items.push({name:"New item", price:0, desc:""});
      renderCategoryEditor();
    });
  });
}

document.getElementById('saveBtn').addEventListener('click', function(){
  content.tagline = document.getElementById('edit-tagline').value;
  content.about = document.getElementById('edit-about').value;
  content.price = document.getElementById('edit-price').value;
  content.phone = document.getElementById('edit-phone').value.replace(/\D/g,'');
  content.addrShort = document.getElementById('edit-addrShort').value;
  content.instagram = document.getElementById('edit-instagram').value.replace('@','').trim();
  content.addr = document.getElementById('edit-addr').value;
  content.vatNote = document.getElementById('edit-vatNote').value;

  var statusEl = document.getElementById('saveStatus');
  fetch('/api/content', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: sessionPassword, content: content })
  }).then(function(res){
    if(!res.ok){
      statusEl.textContent = "Couldn't save - the backend password doesn't match the ADMIN_PASSWORD environment variable.";
      statusEl.style.color = "#c1382b";
      return;
    }
    statusEl.textContent = "Saved - live on the main site.";
    statusEl.style.color = "";
    setTimeout(function(){ statusEl.textContent = ""; }, 4000);
  }).catch(function(e){
    statusEl.textContent = "Couldn't save - try again.";
    statusEl.style.color = "#c1382b";
  });
});

document.getElementById('logoutBtn').addEventListener('click', function(){
  document.getElementById('dashboard').classList.remove('open');
  document.getElementById('gate').style.display = "flex";
  document.getElementById('pwInput').value = "";
});

document.getElementById('pwSubmit').addEventListener('click', function(){
  var val = document.getElementById('pwInput').value;
  var errEl = document.getElementById('pwError');
  errEl.style.display = "none";
  if(val === SITE_PASSWORD){
    sessionPassword = val;
    loadContent().then(function(){
      fillForm();
      document.getElementById('gate').style.display = "none";
      document.getElementById('dashboard').classList.add('open');
    });
  }else{
    errEl.style.display = "block";
  }
});
document.getElementById('pwInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter') document.getElementById('pwSubmit').click();
});
</script>
</body>
</html>

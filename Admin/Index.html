<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burger - Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --char:#1f130d;
    --char-2:#2a1a11;
    --gold:#e8a33d;
    --ketchup:#c1382b;
    --paper:#f3ead9;
    --paper-2:#ece0c9;
    --ink:#2a1d16;
    --pickle:#7c8a52;
    --line: rgba(243,234,217,0.18);
    --font-display:'Barlow Condensed', sans-serif;
    --font-body:'Karla', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:var(--font-body); line-height:1.5;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}

  header.site-nav{background:var(--char); border-bottom:1px solid var(--line);}
  .nav-inner{
    max-width:1180px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 24px;
  }
  .wordmark{font-family:var(--font-display); font-weight:800; font-size:26px; color:var(--paper);}
  .wordmark span{color:var(--gold);}
  .nav-right{display:flex; align-items:center; gap:18px;}
  .admin-tag{
    font-size:12px; font-weight:700; color:var(--gold);
    border:1px solid rgba(232,163,61,0.45); padding:4px 10px; border-radius:100px;
  }
  .nav-right a{color:rgba(243,234,217,0.75); text-decoration:none; font-size:14px; font-weight:500;}
  .nav-right a:hover{color:var(--gold);}

  .gate{
    background:linear-gradient(180deg, var(--char) 0%, var(--char-2) 100%);
    min-height:70vh; display:flex; align-items:center; justify-content:center; padding:60px 24px;
  }
  .gate-box{width:100%; max-width:380px; text-align:left;}
  .gate-box .icon{
    width:52px; height:52px; border-radius:50%; background:rgba(232,163,61,0.12);
    border:1px solid rgba(232,163,61,0.4); display:flex; align-items:center; justify-content:center;
    margin-bottom:22px;
  }
  .gate-box .icon svg{width:20px; height:20px;}
  h1.gate-title{font-family:var(--font-display); font-weight:800; font-size:38px; color:var(--paper); line-height:1;}
  p.gate-sub{color:rgba(243,234,217,0.6); font-size:15px; margin:12px 0 26px;}
  .gate-box input[type=password]{
    width:100%; padding:13px 14px; border:1px solid rgba(243,234,217,0.25);
    border-radius:4px; font-size:15px; margin-bottom:12px; background:rgba(243,234,217,0.06);
    color:var(--paper);
  }
  .gate-box input[type=password]::placeholder{color:rgba(243,234,217,0.4);}
  .gate-box .err{color:#e88b7c; font-size:13px; margin-bottom:12px; display:none;}
  .btn-primary{
    background:var(--gold); color:var(--char); border:none;
    padding:13px 24px; border-radius:3px; font-weight:700; font-size:15px;
    width:100%; text-align:center;
  }
  .btn-primary:hover{background:#f0b34f;}

  .dashboard{display:none; padding:56px 24px 100px;}
  .dashboard.open{display:block;}
  .dash-inner{max-width:760px; margin:0 auto;}
  h2.section-title{font-family:var(--font-display); font-weight:700; font-size:34px; margin-bottom:6px;}
  p.section-sub{color:#6a5a4a; font-size:15px; margin-bottom:36px;}

  .panel{background:#fff; border:1px solid rgba(42,29,22,0.12); border-radius:6px; padding:28px; margin-bottom:26px;}
  .panel h3{font-family:var(--font-display); font-weight:700; font-size:20px; color:var(--ink); margin-bottom:18px;}
  .field{margin-bottom:16px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block; font-size:12px; font-weight:700; color:#4a3a2c; margin-bottom:6px;}
  .field input, .field textarea{
    width:100%; padding:10px 12px; border:1px solid rgba(42,29,22,0.25); border-radius:4px;
    font-family:inherit; font-size:14px; background:var(--paper);
  }
  .field textarea{min-height:80px; resize:vertical;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:560px){.field-row{grid-template-columns:1fr;}}

  .menu-row-edit{
    display:flex; align-items:center; gap:8px; padding:9px 0;
    border-bottom:1px dashed rgba(42,29,22,0.15);
  }
  .menu-row-edit:last-of-type{border-bottom:none;}
  .menu-row-edit input{flex:1; padding:8px 10px; font-size:13px;}
  .menu-row-edit input.group-input{flex:0 0 110px;}
  .menu-row-edit input.tag-input{flex:0 0 90px;}
  .menu-row-edit button{
    background:none; border:none; color:var(--ketchup); font-size:18px; line-height:1; padding:4px 6px;
  }
  .add-item-btn{
    margin-top:14px; background:transparent; border:1px dashed rgba(42,29,22,0.35); color:#4a3a2c;
    width:100%; padding:10px; border-radius:4px; font-size:13px;
  }

  .save-bar{
    position:sticky; bottom:0; background:var(--paper); padding:18px 0 4px;
    display:flex; align-items:center; gap:14px; border-top:1px solid rgba(42,29,22,0.1); margin-top:8px;
  }
  .save-bar button{
    background:var(--gold); border:none; color:var(--char); font-weight:700;
    padding:13px 26px; border-radius:4px; font-size:15px;
  }
  .save-bar .status{font-size:13px; color:var(--pickle);}
  .logout-link{background:none; border:none; color:var(--ketchup); font-size:13px; text-decoration:underline; margin-left:auto;}
</style>
</head>
<body>

<header class="site-nav">
  <div class="nav-inner">
    <div class="wordmark">BURGER<span>.</span></div>
    <div class="nav-right">
      <span class="admin-tag">Admin</span>
      <a href="../index.html">View live site</a>
    </div>
  </div>
</header>

<section class="gate" id="gate">
  <div class="gate-box">
    <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#e8a33d" stroke-width="2"><rect x="4" y="11" width="16" height="9" rx="1.5"></rect><path d="M7 11V7a5 5 0 0110 0v4"></path></svg></div>
    <h1 class="gate-title">Site editor</h1>
    <p class="gate-sub">Enter the password to edit what visitors see on the main site.</p>
    <div class="err" id="pwError">That password isn't right - try again.</div>
    <input type="password" id="pwInput" placeholder="Password" autofocus>
    <button class="btn-primary" id="pwSubmit">Unlock</button>
  </div>
</section>

<main class="dashboard" id="dashboard">
  <div class="dash-inner">
    <h2 class="section-title">Edit your site</h2>
    <p class="section-sub">Changes save live and appear immediately for every visitor to the main site.</p>

    <div class="panel">
      <h3>Hero and about</h3>
      <div class="field"><label>Hero tagline</label><textarea id="edit-tagline"></textarea></div>
      <div class="field"><label>About text</label><textarea id="edit-about"></textarea></div>
    </div>

    <div class="panel">
      <h3>Contact and hours</h3>
      <div class="field-row">
        <div class="field"><label>Price range</label><input id="edit-price"></div>
        <div class="field"><label>Phone (digits only, with country code)</label><input id="edit-phone"></div>
      </div>
      <div class="field"><label>Address (short)</label><input id="edit-addr"></div>
    </div>

    <div class="panel">
      <h3>Menu items</h3>
      <div id="menuEditorList"></div>
      <button class="add-item-btn" id="addMenuItem">+ Add menu item</button>
    </div>

    <div class="save-bar">
      <button id="saveBtn">Save changes</button>
      <span class="status" id="saveStatus"></span>
      <button class="logout-link" id="logoutBtn">Log out</button>
    </div>
  </div>
</main>

<script>
var SITE_PASSWORD = "WuseGrill#47xK";

var DEFAULTS = {
  tagline: "Thick milkshakes, char-grilled patties, and Wuse 2's most argued-about cheeseburger. Order in for pickup or delivery tonight.",
  about: "A no-shortcuts burger counter in Wuse 2 - beef patties on the grill, buns toasted to order, shakes churned thick enough to need a spoon. Come hungry, leave full.",
  price: "NGN 10,000-20,000 per person",
  addr: "55 Kumasi Cres, Wuse 2, Abuja",
  phone: "2347087271489",
  menu: [
    {group:"Burgers", name:"House Beef Burger", tag:"classic"},
    {group:"Burgers", name:"House Double Beef Burger", tag:"big"},
    {group:"Burgers", name:"G Mex Chilli Cheese Burger", tag:"spicy"},
    {group:"Burgers", name:"Hot Chilly Cheeseburger", tag:"spicy"},
    {group:"Burgers", name:"House Chili Cheese Burger", tag:"spicy"},
    {group:"Burgers", name:"House Cheese Burger", tag:"classic"},
    {group:"Shakes and Sides", name:"Vanilla Shake", tag:""},
    {group:"Shakes and Sides", name:"Strawberry Milkshake", tag:""},
    {group:"Shakes and Sides", name:"Oreo Vanilla Milkshake", tag:""},
    {group:"Shakes and Sides", name:"2 in One Vanilla and Strawberry", tag:""},
    {group:"Shakes and Sides", name:"Burger and Chili Cheese Fries", tag:""},
    {group:"Shakes and Sides", name:"Double Patty Burger and Spicy Cheesy Chips", tag:""}
  ]
};

var content = JSON.parse(JSON.stringify(DEFAULTS));
var sessionPassword = "";

function loadContent(){
  return fetch('/.netlify/functions/content')
    .then(function(res){ return res.json(); })
    .then(function(data){
      if(data){
        content = Object.assign({}, DEFAULTS, data);
      }
    })
    .catch(function(e){ /* no saved content yet, or backend not reachable - defaults are fine */ });
}

function fillForm(){
  document.getElementById('edit-tagline').value = content.tagline;
  document.getElementById('edit-about').value = content.about;
  document.getElementById('edit-price').value = content.price;
  document.getElementById('edit-addr').value = content.addr;
  document.getElementById('edit-phone').value = content.phone;
  renderMenuEditor();
}

function renderMenuEditor(){
  var wrap = document.getElementById('menuEditorList');
  wrap.innerHTML = "";
  content.menu.forEach(function(item, idx){
    var row = document.createElement('div');
    row.className = 'menu-row-edit';
    row.innerHTML =
      '<input class="group-input" data-idx="' + idx + '" data-field="group" value="' + item.group + '" placeholder="Group">' +
      '<input data-idx="' + idx + '" data-field="name" value="' + item.name + '" placeholder="Item name">' +
      '<input class="tag-input" data-idx="' + idx + '" data-field="tag" value="' + (item.tag || '') + '" placeholder="Tag">' +
      '<button data-remove="' + idx + '" title="Remove item" aria-label="Remove item">x</button>';
    wrap.appendChild(row);
  });
  wrap.querySelectorAll('input').forEach(function(inp){
    inp.addEventListener('input', function(){
      content.menu[+inp.dataset.idx][inp.dataset.field] = inp.value;
    });
  });
  wrap.querySelectorAll('button[data-remove]').forEach(function(btn){
    btn.addEventListener('click', function(){
      content.menu.splice(+btn.dataset.remove, 1);
      renderMenuEditor();
    });
  });
}

document.getElementById('addMenuItem').addEventListener('click', function(){
  content.menu.push({group:"Burgers", name:"New item", tag:""});
  renderMenuEditor();
});

document.getElementById('saveBtn').addEventListener('click', function(){
  content.tagline = document.getElementById('edit-tagline').value;
  content.about = document.getElementById('edit-about').value;
  content.price = document.getElementById('edit-price').value;
  content.addr = document.getElementById('edit-addr').value;
  content.phone = document.getElementById('edit-phone').value.replace(/\D/g,'');

  var statusEl = document.getElementById('saveStatus');
  fetch('/.netlify/functions/content', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: sessionPassword, content: content })
  }).then(function(res){
    if(!res.ok){
      statusEl.textContent = "Couldn't save - the backend password doesn't match. Check the ADMIN_PASSWORD environment variable in Netlify.";
      statusEl.style.color = "#c1382b";
      return;
    }
    statusEl.textContent = "Saved - live on the main site.";
    statusEl.style.color = "";
    setTimeout(function(){ statusEl.textContent = ""; }, 4000);
  }).catch(function(e){
    statusEl.textContent = "Couldn't save - try again.";
    statusEl.style.color = "#c1382b";
  });
});

document.getElementById('logoutBtn').addEventListener('click', function(){
  document.getElementById('dashboard').classList.remove('open');
  document.getElementById('gate').style.display = "flex";
  document.getElementById('pwInput').value = "";
});

document.getElementById('pwSubmit').addEventListener('click', function(){
  var val = document.getElementById('pwInput').value;
  var errEl = document.getElementById('pwError');
  errEl.style.display = "none";

  if(val === SITE_PASSWORD){
    sessionPassword = val;
    loadContent().then(function(){
      fillForm();
      document.getElementById('gate').style.display = "none";
      document.getElementById('dashboard').classList.add('open');
    });
  }else{
    errEl.style.display = "block";
  }
});
document.getElementById('pwInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter') document.getElementById('pwSubmit').click();
});
</script>
</body>
</html>
